services:
  sim:
    image: astra/sim
    working_dir: /workspace/ecm
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
    shm_size: "8gb"
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
      NVIDIA_DRIVER_CAPABILITIES: all
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: "Y"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - isaac-kit-cache:/isaac-sim/kit/cache
      - isaac-kit-data:/isaac-sim/kit/data
      - isaac-ov-cache:/home/isaaclab/.cache/ov
      - isaac-gl-cache:/home/isaaclab/.cache/nvidia/GLCache
      - isaac-compute-cache:/home/isaaclab/.nv/ComputeCache
      - isaac-logs:/home/isaaclab/.nvidia-omniverse/logs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/tmp/.Xauthority:ro
      - ./recordings:/workspace/ecm/recordings
      - ./outputs:/workspace/ecm/outputs
      - ./eval_result:/workspace/ecm/eval_result

volumes:
  isaac-kit-cache:
  isaac-kit-data:
  isaac-ov-cache:
  isaac-gl-cache:
  isaac-compute-cache:
  isaac-logs:
