# Astra schema: single source of truth for observation keys, state/action layouts and rates.
# Read by astra.schema.load_schema(). The offline dataset builder, the observation adapter, the
# action codec and GR00T's modality.json / galbot_config.py must all agree with this file.
version: 1

control_hz: 50   # asserted against usr_args["decimation"] (physics 200 Hz / decimation 4)
data_fps: 50     # demonstrations hold one row per control step (measured: 19.4 ms per step)

# Quaternion component order expected by the sim's DiffIK pose command (action dims 3:7, 10:14).
# Upstream Isaac Lab names them quat_x, quat_y, quat_z, quat_w. VERIFY on the pinned commit:
# command the current FK pose and check that the arm does not move.
action_quat_order: xyzw

# Form of the action sent to the env. velocity19 = [arms, grippers | vx, vy, wz], smoothed by the env.
# wheels20 = legacy [arms, grippers | wheel1..4], applied by the env as is. auto = velocity19 when the
# env accepts 19 values, otherwise wheels20.
sim_action_format: auto

# All 77 articulation joint names in joint_pos order. TODO: dump once from the env server
# (scripts/start_sim.sh --shell → env.scene["robot"].joint_names) and paste here.
# Known by index so far (measured in the sim by closing one gripper at a time): the left gripper
# drives joints 65, 66, 67, 74 to +1.703 and 68, 73 to -1.703; the right one 69, 70, 71, 76 and
# 72, 75.
joint_names: []

kinematics:
  # Robot description used for forward kinematics (base_link → arm_link7). TODO: export URDF.
  urdf_path: null
  base_link: base_link
  left_tool_link: left_arm_link7
  right_tool_link: right_arm_link7
  tool_offset_pos: [0.0, 0.0, 0.0]       # matches _GALBOT_TCP_OFFSET_POS
  tool_offset_quat_xyzw: [0.0, 0.0, 0.0, 1.0]

cameras:                 # Astra name → env observation key, native (H, W)
  head:        { key: first_person_camera_rgb, hw: [480, 640] }
  left_wrist:  { key: left_hand_camera_rgb,    hw: [224, 224] }
  right_wrist: { key: right_hand_camera_rgb,   hw: [224, 224] }

state:                   # concatenation order = state vector layout (34)
  left_eef_9d:  { fk: left_arm_link7,  dim: 9 }
  right_eef_9d: { fk: right_arm_link7, dim: 9 }
  left_arm_q:   { joints: [left_arm_joint1, left_arm_joint2, left_arm_joint3, left_arm_joint4,
                           left_arm_joint5, left_arm_joint6, left_arm_joint7], dim: 7 }
  right_arm_q:  { joints: [right_arm_joint1, right_arm_joint2, right_arm_joint3, right_arm_joint4,
                           right_arm_joint5, right_arm_joint6, right_arm_joint7], dim: 7 }
  gripper:      { joints: [left_gripper_joint, right_gripper_joint], dim: 2 }
