# Astra runtime parameters for layers 2-6. Loaded by astra.policy.AstraPolicy.get_model().
# Values are starting points; tune them on validation rollouts.

checkpoints:
  act: null                          # path to LeRobot ACT pretrained_model/ directory
  groot: null                        # path to fine-tuned GR00T N1.7 checkpoint directory
  stage_classifier: null             # path to stage classifier weights
device: cuda:0

adapter:
  history_seconds: 3.0               # ring-buffer length for classifier / detectors
  act_image_hw: [224, 224]           # ACT input size (head camera is squashed to this)
  max_invalid_ticks: 5               # consecutive invalid observations before a safety hold
  blank_image_std_threshold: 2.0     # image std (0-255) below this counts as a blank frame

orchestrator:
  enabled: true                      # false = single policy without stage conditioning
  debounce_ticks: 12                 # agreement needed before an advance (~0.25 s)
  enter_prob: 0.8                    # classifier probability for the next stage
  stall_seconds: 8.0                 # no progress increase for this long → retry
  max_retries_per_stage: 3
  total_budget_s: 880.0              # all stages with retries (episode limit is 900 s)
  stage_budget_s: [35, 30, 30, 70, 50, 45]   # median demo duration × 1.4 (placeholder)
  min_dwell_s: [4, 3, 3, 8, 5, 4]            # 0.5 × shortest demo duration (placeholder)
  # Hinged lid (Lid001_joint, normalized 0 closed … 1 open = 90°); sim: open >= 0.4, closed <= 0.005
  lid_open_target: 0.55              # stage 1: estimated angle needed (≈ 50°, margin over 0.4)
  lid_stable_th: 0.45                # stage 1: vision angle must stay above this after release
  lid_closed_vision_th: 0.02         # stage 6: vision angle must stay below this after release
  lid_stable_s: 1.0                  # stability window after release (stages 1 and 6)
  lid_retract_m: 0.08                # hand must move this far from the handle after release

detectors:
  holding_margin_rad: 0.08           # settled gripper below 1.703 - margin → holding an object
  gripper_settle_s: 0.2
  contact_error_m: 0.015             # EEF tracking error that counts as contact
  wipe_dwell_s: 0.75                 # > sim's 0.5 s requirement
  wipe_target_count: 6               # > sim's 5 contacts
  lid_slip_threshold_m: 0.03         # holding EEF this far off the hinge arc → kinematic lid estimate unreliable
  hinge_calibration: null            # YAML with lid hinge axis (base frame), fitted offline from demos

router:
  default_source: act
  stage_to_source: [act, act, act, script, act, act]   # per Stage 0..5; script = wiping primitive
  switch_only_at_stage_boundary: true

executor:
  execute_steps: { act: 25, groot: 20 }   # chunk steps before re-planning (0.5 s and 0.4 s at 50 Hz)
  temporal_ensemble: false                # ACT ensembling on continuous dims only
  ensemble_coeff: 0.01
  blend_ticks: 5                          # crossfade length when a new chunk starts

safety:
  workspace_min: [-0.2, -0.8, 0.3]        # base-frame EEF box (m), placeholder
  workspace_max: [1.0, 0.8, 1.8]
  max_eef_step_m: 0.02                    # per control tick
  max_eef_rot_step_rad: 0.08
  max_base_lin_vel: 1.0                   # |vx|, |vy| limit in m/s; three demos reach 0.99 and 0.70
  max_base_ang_vel: 1.0                   # |wz| limit in rad/s; three demos reach 1.0
  base_vel_deadband: 0.02
  gripper_hysteresis: [0.35, 0.65]        # p_closed below → open, above → close

scripted_wipe:
  press_depth_m: 0.018                    # target this far "inside" the surface
  dwell_s: 0.8
  lift_m: 0.03
  n_contacts: 6                           # sim needs 5, one spare
